name: Integrate reviewed UI patch once
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: binpc2-ui-patch-once
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'aoaldhkd-spec/BINPC2' && github.event.pull_request.number == 7 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/binpc2-received-push-inapp-direct-link-20261013'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REVIEW_BRANCH: fix/binpc2-received-push-inapp-direct-link-20261013
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify and apply exact reviewed source patch
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/binpc2-reports"
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib
          p = pathlib.Path('.github/review-transfer')
          encoded = ''.join((p / f'part-{n}.txt').read_text().strip() for n in range(1,5))
          raw = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'e60a3eb13e982fd24ea917992d2b47bfccb7527efd9040ac47e934417b53498f', 'PATCH_SHA256_MISMATCH'
          pathlib.Path('/tmp/binpc2-reviewed.patch').write_bytes(raw)
          for name, expected in [('supplement.patch','60fec35eaff38691c5d9d8858f10666a4b219864a9919ebdbbcd5c954925a9e2'),('supplement2.patch','4054890578c2252c14b5a6bc3d3be8f0629766b443215d2a017d7cc929751630')]:
            assert hashlib.sha256((p/name).read_bytes()).hexdigest() == expected, name + ' checksum mismatch'
          # Correct one transcription character in the temporary transfer, then validate the full plaintext digest.
          encoded3 = (p/'supplement3.xz.b64').read_text().strip().replace('deBUeU3sUR','deBUe/3sUR')
          raw3 = lzma.decompress(base64.b64decode(encoded3, validate=True))
          assert hashlib.sha256(raw3).hexdigest() == '65c162540f06faec26d5157b250361dcd34e5ce4d22c3253dcb8985fe9fdb3e7', 'TYPED_FIX_SHA256_MISMATCH'
          pathlib.Path('/tmp/binpc2-typed.patch').write_bytes(raw3)
          print('All reviewed source patches verified')
          PY
          git apply --check /tmp/binpc2-reviewed.patch
          git apply /tmp/binpc2-reviewed.patch
          for patch in .github/review-transfer/supplement.patch .github/review-transfer/supplement2.patch /tmp/binpc2-typed.patch; do
            git apply --check "$patch"; git apply "$patch"
          done
          cp .github/review-transfer/browser-review.mjs "$RUNNER_TEMP/binpc2-browser-review.mjs"
          rm .github/review-transfer/part-{1,2,3,4}.txt .github/review-transfer/supplement.patch .github/review-transfer/supplement2.patch .github/review-transfer/supplement3.xz.b64 .github/review-transfer/browser-review.mjs
          rmdir .github/review-transfer
          rm .github/workflows/apply-ui-review-once.yml
          git diff --check
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        id: dependencies
      - name: Complete checks without production credentials
        id: checks
        shell: bash
        run: |
          set +e
          set -uo pipefail
          failed=0
          commands=(
            'pnpm run verify:records'
            'pnpm run verify:guards'
            'pnpm run audit:code'
            'pnpm --filter @workspace/api-server test:unit'
            'pnpm --filter @workspace/boltnew-app test:unit'
            'pnpm --filter @workspace/boltnew-app typecheck'
            'pnpm --filter @workspace/boltnew-app lint'
            'pnpm --filter @workspace/boltnew-app build'
            'pnpm --filter @workspace/api-server typecheck'
            'pnpm --filter @workspace/api-server lint'
            'pnpm --filter @workspace/api-server build'
          )
          i=0
          for command in "${commands[@]}"; do
            i=$((i+1))
            echo "::group::$command"
            bash -o pipefail -c "$command" 2>&1 | tee "$RUNNER_TEMP/binpc2-reports/check-$i.log"
            code=${PIPESTATUS[0]}
            printf '%s\t%s\t%s\n' "$i" "$code" "$command" >> "$RUNNER_TEMP/binpc2-reports/results.tsv"
            if [ "$code" -ne 0 ]; then failed=1; fi
            echo '::endgroup::'
          done
          exit "$failed"
      - name: Real Chromium responsive UI with synthetic API only
        if: always() && steps.dependencies.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/boltnew-app/dist/public/index.html
          pnpm --filter @workspace/boltnew-app exec playwright install --with-deps chromium
          sudo apt-get install -y -qq fonts-noto-cjk
          node "$RUNNER_TEMP/binpc2-browser-review.mjs" 2>&1 | tee "$RUNNER_TEMP/binpc2-reports/browser-run.log"
      - name: Commit only after tests and reject concurrent branch changes
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git ls-remote origin "refs/heads/$REVIEW_BRANCH" | cut -f1)"
          test "$ACTUAL" = "$EXPECTED_HEAD" || { echo 'Concurrent change detected; no push performed'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ui): responsive layout, scroll-safe taps, consent and rainbow help'
          git push origin "HEAD:refs/heads/$REVIEW_BRANCH"
          git rev-parse HEAD | tee "$RUNNER_TEMP/binpc2-reports/tested-commit.txt"
      - name: Package review evidence and runnable preview
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/binpc2-review"
          cp -R "$RUNNER_TEMP/binpc2-reports" "$RUNNER_TEMP/binpc2-review/reports" || true
          git diff > "$RUNNER_TEMP/binpc2-review/uncommitted.patch"
          git archive --format=zip HEAD -o "$RUNNER_TEMP/binpc2-review/source.zip"
          if [ -d artifacts/boltnew-app/dist/public ]; then
            cp -R artifacts/boltnew-app/dist/public "$RUNNER_TEMP/binpc2-review/frontend"
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/binpc2-review/commit.txt"
          cd "$RUNNER_TEMP/binpc2-review"
          sha256sum source.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: binpc2-ui-validated
          path: ${{ runner.temp }}/binpc2-review/
          retention-days: 7
          if-no-files-found: error
