name: Keep API warm

on:
  schedule:
    # Render free tier: 15분 idle 후 sleep — 10분마다 핑
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/keep-api-warm.mjs
