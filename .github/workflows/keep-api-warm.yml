name: Keep API warm

on:
  schedule:
    # Render starter is always-on; still ping after deploys / brief process restarts.
    # GitHub cron can drift; 10 min is enough to keep health checks warm.
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/keep-api-warm.mjs
