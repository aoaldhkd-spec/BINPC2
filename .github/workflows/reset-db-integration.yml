name: Isolated PostgreSQL reset safety
on:
  pull_request:
    paths:
      - 'artifacts/api-server/src/lib/db-event-reset-transaction*'
      - 'artifacts/api-server/src/lib/db-event-profile-write*'
      - 'artifacts/api-server/src/lib/db-event-admission*'
      - 'artifacts/api-server/src/lib/db-npc-heart-atomic*'
      - 'artifacts/api-server/src/lib/db-npc-heart-recharge*'
      - 'artifacts/api-server/src/routes/db.ts'
      - '.github/workflows/reset-db-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-reset-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: binpc2_reset_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d binpc2_reset_test"
          --health-interval 3s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Verify actual Postgres BEGIN/COMMIT/ROLLBACK/fault injection
        env:
          TEST_DATABASE_URL: postgres://postgres:isolated-ci-password@localhost:5432/binpc2_reset_test
        run: pnpm --filter @workspace/api-server exec vitest run src/lib/db-event-reset-transaction.pg.test.ts
