name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Single entrypoint — must match package.json "verify:ci" (guards enforce parity)
      - run: pnpm run verify:ci
      # Read-only safety checks: do not execute real pg_dump or access production credentials.
      - name: Encrypted DB/photo backup guard tests (offline only)
        run: node --test scripts/backup-db-photo-encrypted.test.mjs
      # Non-network mocked tests: retry transient pings, but reject persistent outages.
      # Existing verify:ci is unchanged; these cases add coverage, never suppress failures.
      - name: Health ping retry and failure policy
        run: node --test scripts/keep-api-warm.test.mjs
