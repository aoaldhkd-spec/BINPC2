name: Isolated event hub V6
on:
  push:
    branches: ["feat/event-hub-v6-20261027"]
    paths:
      - "artifacts/api-server/**"
      - "artifacts/boltnew-app/**"
      - "lib/api-zod/**"
      - "scripts/**"
      - ".github/workflows/event-hub-integration.yml"
  pull_request:
    paths:
      - "artifacts/api-server/**"
      - "artifacts/boltnew-app/**"
      - "lib/api-zod/**"
      - "scripts/prepare-event-hub-e2e.mjs"
      - ".github/workflows/event-hub-integration.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  event-hub:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s --health-timeout 3s --health-retries 15
    env:
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:isolated-ci-password@127.0.0.1:5432/binpc2_hub_dev?sslmode=disable
      HUB_TEST_DATABASE_URL: postgres://postgres:isolated-ci-password@127.0.0.1:5432/binpc2_hub_test_resume?sslmode=disable
      TEST_DATABASE_URL: postgres://postgres:isolated-ci-password@127.0.0.1:5432/binpc2_reset_test?sslmode=disable
      SESSION_SECRET: isolated-ci-fixture-session-key-not-for-deployment
      BOOTSTRAP_ADMIN_PASSWORD: isolated-ci-admin-password
      HUB_E2E_BASE_URL: http://127.0.0.1:3001
      API_PROXY_TARGET: http://127.0.0.1:8081
      LOCAL_API: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: node scripts/prepare-event-hub-e2e.mjs database
      - run: pnpm run build
      - name: Existing API unit regression checks
        run: pnpm --filter @workspace/api-server exec vitest run --config vitest.config.ts --reporter=verbose --reporter=github-actions
      - name: Existing UI unit regression checks
        run: pnpm --filter @workspace/boltnew-app exec vitest run --config vitest.config.ts --reporter=verbose --reporter=github-actions
      - name: Existing core-protection guards
        run: pnpm run verify:guards
      - name: Current documentation checks
        run: pnpm run verify:records
      - name: Production-entry guards and redaction
        run: node --test scripts/test/production-entry-guards.test.mjs scripts/test/ops-client.test.mjs scripts/test/code-fingerprint.test.mjs scripts/test/event-hub-lookup-cli.test.mjs
      - name: Actual PostgreSQL invariants and existing reset safety
        run: pnpm --filter @workspace/api-server exec vitest run src/lib/event-hub.pg.test.ts src/lib/db-event-reset-transaction.pg.test.ts
      - run: pnpm --filter @workspace/boltnew-app exec playwright install --with-deps chromium
      - name: Pin an explicit internal business clock for admission and mobile regression
        run: |
          OFFSET=$(node -e "process.stdout.write(String(Date.parse('2026-10-30T15:10:00Z')-Date.now()))")
          echo "HUB_LOAD_CLOCK_OFFSET_MS=$OFFSET" >> "$GITHUB_ENV"
          echo "HUB_E2E_CLOCK_OFFSET_MS=$OFFSET" >> "$GITHUB_ENV"
      - name: Start dedicated local API and frontend
        run: |
          PORT=8081 node --import ./scripts/event-hub-load-clock.mjs artifacts/api-server/dist/index.mjs > /tmp/event-hub-api.log 2>&1 &
          PORT=3001 pnpm dev > /tmp/event-hub-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/api/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3001/api/healthz
      - run: node scripts/prepare-event-hub-e2e.mjs activate
      - name: Browser recovery, inquiry, layout and 100-session HTTP tests
        run: pnpm --filter @workspace/boltnew-app exec playwright test --config playwright.event-hub.config.ts --reporter=line,github
      - name: Actual 150-person HTTP/PostgreSQL mixed regression on accumulated records
        env:
          HUB_LOAD_DB_PASSWORD: isolated-ci-password
        run: node scripts/event-hub-http-soak.mjs --mode mixed --minutes 1 --port 8120
      - name: Preserve synthetic actual-app screenshots and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-v6-actual-app-evidence
          retention-days: 7
          path: |
            artifacts/boltnew-app/test-results/event-hub-v6/**/*.png
            artifacts/boltnew-app/test-results/event-hub-v6/**/*.webm
            artifacts/api-server/dist/build-identity.json
            .local/v6-finish/*-result.json
          if-no-files-found: ignore
