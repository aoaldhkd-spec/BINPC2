# BINPC2 frontend — Netlify auto-reads this file at repo root.
# After API is on Render, set Netlify site env: API_URL = https://YOUR-API.onrender.com

[build]
  command = "corepack pnpm install && corepack pnpm --filter @workspace/boltnew-app build"
  publish = "artifacts/boltnew-app/dist/public"

[build.environment]
  NODE_VERSION = "22"
  COREPACK_ENABLE_DOWNLOAD_PROMPT = "0"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, no-transform"
    X-Accel-Buffering = "no"

[[headers]]
  for = "/api/db/events"
  [headers.values]
    Cache-Control = "no-cache, no-store, no-transform"
    X-Accel-Buffering = "no"
    Content-Type = "text/event-stream; charset=utf-8"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/admin"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/test"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/test/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/api/*"
  to = ":env(API_URL)/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
