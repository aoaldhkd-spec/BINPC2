# BINPC2 frontend — Netlify auto-reads this file at repo root.
# After API is on Render, set Netlify site env: API_URL = https://YOUR-API.onrender.com

[build]
  command = "corepack pnpm install && corepack pnpm --filter @workspace/boltnew-app build"
  publish = "artifacts/boltnew-app/dist/public"

[build.environment]
  NODE_VERSION = "22"
  COREPACK_ENABLE_DOWNLOAD_PROMPT = "0"

[[redirects]]
  from = "/api/*"
  to = ":env(API_URL)/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
