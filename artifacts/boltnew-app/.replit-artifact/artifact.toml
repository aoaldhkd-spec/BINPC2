kind = "web"
previewPath = "/"
title = "볼트뉴 앱"
version = "1.0.0"
id = "artifacts/boltnew-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21066

[services.development]
run = "pnpm --filter @workspace/boltnew-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/boltnew-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/boltnew-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21066"
BASE_PATH = "/"
